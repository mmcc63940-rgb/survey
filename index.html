<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Опрос: суббота в школе</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    padding: 20px;
    display: flex;
    justify-content: center;
    align-items: flex-start;
  }
  .container {
    background: #fff;
    max-width: 720px;
    width: 100%;
    border-radius: 16px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    overflow: hidden;
  }
  .header {
    background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
    color: #fff;
    padding: 40px 30px;
    text-align: center;
  }
  .header h1 { font-size: 26px; margin-bottom: 10px; }
  .header p { opacity: 0.95; font-size: 15px; line-height: 1.5; }
  form { padding: 30px; }
  .question { margin-bottom: 28px; }
  .question label.q-title {
    display: block;
    font-weight: 600;
    color: #333;
    margin-bottom: 12px;
    font-size: 16px;
  }
  .required { color: #e74c3c; }
  .options label {
    display: flex;
    align-items: center;
    padding: 12px 16px;
    margin-bottom: 8px;
    background: #f7f9fc;
    border: 2px solid #e8eef5;
    border-radius: 10px;
    cursor: pointer;
    transition: all 0.2s;
    font-size: 15px;
  }
  .options label:hover { background: #eef4ff; border-color: #4facfe; }
  .options input[type="radio"],
  .options input[type="checkbox"] {
    margin-right: 12px;
    width: 18px; height: 18px;
    accent-color: #4facfe;
    flex-shrink: 0; /* чтобы чекбокс не сжимался */
  }
  input[type="text"], textarea, select {
    width: 100%;
    padding: 12px 14px;
    border: 2px solid #e8eef5;
    border-radius: 10px;
    font-size: 15px;
    font-family: inherit;
    transition: border-color 0.2s;
  }
  input[type="text"]:focus, textarea:focus, select:focus {
    outline: none;
    border-color: #4facfe;
  }
  textarea { resize: vertical; min-height: 100px; }
  .btn {
    width: 100%;
    padding: 16px;
    background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
    color: #fff;
    border: none;
    border-radius: 10px;
    font-size: 17px;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.2s, box-shadow 0.2s;
  }
  .btn:hover:not(:disabled) {
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(79,172,254,0.4);
  }
  .btn:disabled { opacity: 0.6; cursor: not-allowed; }
  .success {
    display: none;
    text-align: center;
    padding: 60px 30px;
  }
  .success .check { font-size: 64px; margin-bottom: 20px; }
  .success h2 { color: #27ae60; margin-bottom: 12px; }
  .success p { color: #666; line-height: 1.6; }
  @media (max-width: 600px) {
    form { padding: 20px; }
    .header { padding: 30px 20px; }
    .header h1 { font-size: 20px; }
  }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>📋 Опрос: субботние занятия</h1>
    <p>Уважаемые родители и ученики! Просим вас принять участие в опросе о судьбе учебной субботы. Ваше мнение очень важно для нас.</p>
  </div>

  <form id="surveyForm">
    <div class="question">
      <label class="q-title">1. Кто вы? <span class="required">*</span></label>
      <div class="options">
        <label><input type="radio" name="role" value="Родитель" required> Родитель</label>
        <label><input type="radio" name="role" value="Ученик"> Ученик</label>
      </div>
    </div>

    <!-- Изменение 1 и 2: Параллель + добавлен Родитель -->
    <div class="question">
      <label class="q-title" for="grade">2. Параллель</label>
      <select id="grade" name="grade">
        <option value="">— Выберите параллель —</option>
        <option>5</option><option>6</option><option>7</option>
        <option>8</option><option>9</option><option>10</option><option>11</option>
        <option>Родитель</option>
      </select>
    </div>

    <!-- Изменение 3 и 4: Новые варианты с приписками -->
    <div class="question">
      <label class="q-title">3. Как вы относитесь к учёбе в субботу? <span class="required">*</span></label>
      <div class="options">
        <label><input type="radio" name="attitude" value="Поддерживаю (ЗА учебу в субботу)" required> Поддерживаю (ЗА учебу в субботу)</label>
        <label><input type="radio" name="attitude" value="Не поддерживаю (ПРОТИВ учебы в субботу)"> Не поддерживаю (ПРОТИВ учебы в субботу)</label>
      </div>
    </div>

    <!-- Изменение 5: Чекбоксы для выбора нескольких вариантов -->
    <div class="question">
      <label class="q-title">4. Какой вариант вы предпочитаете? (можно несколько) <span class="required">*</span></label>
      <div class="options">
        <label><input type="checkbox" name="preference" value="Полная отмена субботы"> Полная отмена субботы</label>
        <label><input type="checkbox" name="preference" value="Перенос в дистанционный формат"> Перенос субботы в дистанционный формат</label>
        <label><input type="checkbox" name="preference" value="Оставить офлайн"> Оставить офлайн-занятия</label>
      </div>
    </div>

    <div class="question">
      <label class="q-title">5. Укажите причины вашего выбора (можно несколько)</label>
      <div class="options">
        <label><input type="checkbox" name="reasons" value="Перегрузка ребёнка"> Перегрузка ребёнка</label>
        <label><input type="checkbox" name="reasons" value="Нехватка времени на отдых"> Нехватка времени на отдых и семью</label>
        <label><input type="checkbox" name="reasons" value="Снижение успеваемости"> Снижение успеваемости из-за усталости</label>
        <label><input type="checkbox" name="reasons" value="Удобство дистанта"> Удобство дистанционного формата</label>
        <label><input type="checkbox" name="reasons" value="Качество офлайн выше"> Качество офлайн-занятий выше</label>
        <label><input type="checkbox" name="reasons" value="Другое"> Другое</label>
      </div>
    </div>

    <div class="question">
      <label class="q-title" for="comment">6. Ваши предложения и комментарии</label>
      <textarea id="comment" name="comment" placeholder="Если хотите пояснить свою позицию — напишите здесь..."></textarea>
    </div>

    <button type="submit" class="btn" id="submitBtn">Отправить ответ</button>
  </form>

  <!-- Изменение 6: Блок статистики полностью удален, осталось только "Спасибо" -->
  <div class="success" id="successMsg">
    <div class="check">✅</div>
    <h2>Спасибо за участие!</h2>
    <p>Ваш ответ успешно отправлен.<br>Мы обязательно учтём ваше мнение.</p>
  </div>
</div>

<script>
  const API_URL = 'https://script.google.com/macros/s/AKfycbwP1GwaYrMHMGGbBP4RMQhITINuM2MbjkNm3QSyk0HAnIG5PKR2QNU6PNtE-nTyk4KKtw/exec';

  document.getElementById('surveyForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    const form = this;
    const btn = document.getElementById('submitBtn');

    // Собираем выбранные варианты в пункте 4
    const selectedPreferences = [...form.querySelectorAll('input[name="preference"]:checked')];
    
    // ПРОВЕРКА: если в пункте 4 ничего не выбрано — останавливаем отправку
    if (selectedPreferences.length === 0) {
      alert('Пожалуйста, выберите хотя бы один вариант в пункте 4.');
      return; // останавливаем отправку
    }

    const data = {
      role: form.querySelector('input[name="role"]:checked')?.value || '',
      grade: form.querySelector('#grade').value || '',
      attitude: form.querySelector('input[name="attitude"]:checked')?.value || '',
      preference: selectedPreferences.map(c => c.value), // берем значения выбранных
      reasons: [...form.querySelectorAll('input[name="reasons"]:checked')].map(c => c.value),
      comment: form.querySelector('#comment').value.trim()
    };

    btn.disabled = true;
    btn.textContent = 'Отправка...';

    try {
      const resp = await fetch(API_URL, {
        method: 'POST',
        body: JSON.stringify(data)
      });
      const result = await resp.json();
      console.log('Ответ сервера:', result);

      if (result.status === 'error') {
        throw new Error(result.message);
      }

      form.style.display = 'none';
      document.getElementById('successMsg').style.display = 'block';
    } catch (err) {
      console.error('Ошибка отправки:', err);
      alert('Ошибка отправки: ' + err.message);
      btn.disabled = false;
      btn.textContent = 'Отправить ответ';
    }
  });
</script>
</body>
</html>
